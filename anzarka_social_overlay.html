<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; width: 100%; height: 100%;
    overflow: hidden; background: transparent;
    font-family: Arial, Helvetica, sans-serif;
  }
  .wrap {
    position: relative; width: 620px; height: 72px;
    display: flex; align-items: center;
    padding: 0 18px; overflow: hidden;
    background: rgba(15, 13, 18, .88);
    border: 2px solid #d9ad35;
    border-radius: 9px;
    box-shadow: 0 3px 14px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,220,120,.12);
  }
  .slide {
    position: absolute; inset: 0;
    display: flex; align-items: center; gap: 14px;
    padding: 0 18px;
    color: #f7d36a;
    font-size: 27px; font-weight: 800; letter-spacing: .4px;
    white-space: nowrap;
    opacity: 0; transform: translateY(8px);
    transition: opacity .42s ease, transform .42s ease;
  }
  .slide.active { opacity: 1; transform: translateY(0); }
  .twitch-mark {
    width: 34px; height: 34px; flex: 0 0 34px;
    display: grid; place-items: center;
    border-radius: 8px; background: #9146ff;
    color: white; font-size: 22px; font-weight: 900;
    letter-spacing: -2px; padding-right: 2px;
  }
  .logo {
    width: 34px; height: 34px; object-fit: contain; flex: 0 0 34px;
    filter: drop-shadow(0 0 3px rgba(255,80,65,.25));
  }
  .label { text-shadow: 0 1px 2px rgba(0,0,0,.7); }
  .divider {
    width: 1px; height: 30px; background: rgba(240,205,115,.45);
    margin: 0 2px;
  }
  .hint {
    position: absolute; right: 13px; bottom: 4px;
    color: rgba(255,255,255,.28); font-size: 8px; letter-spacing: 1px;
  }
</style>
